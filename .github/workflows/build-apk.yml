name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Klonowanie repozytorium
      uses: actions/checkout@v4

    - name: Konfiguracja Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20 # Zalecana stabilna wersja LTS (lub 22)

    - name: Konfiguracja środowiska Java (wymagana dla Androida)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalacja zależności projektu
      run: npm install

    - name: Budowanie aplikacji webowej
      run: npm run build

    - name: Synchronizacja z platformą Android (Capacitor)
      run: npx cap sync android

    - name: Make gradlew executable
      run: chmod +x ./android/gradlew
      
    - name: Budowanie pliku APK (Debug)
      working-directory: ./android
      run: ./gradlew assembleDebug

    - name: Przesłanie pliku APK jako artefaktu
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
